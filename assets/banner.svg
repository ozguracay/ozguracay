<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Ozgur Serhat Acay — Senior MLOps &amp; ML Engineer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#13233f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dd4bf"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <style>
      .t { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
      .edge { stroke: #5eead4; stroke-opacity: 0.32; stroke-width: 1.5; }
      .node { fill: #0b1220; stroke: #5eead4; stroke-width: 2; }
      .hub { fill: #2dd4bf; }
      .pulse { animation: pulse 3.6s ease-in-out infinite; }
      .d2 { animation-delay: -2.4s; }
      .d3 { animation-delay: -1.2s; }
      @keyframes pulse { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .pulse { animation: none; opacity: 1; } }
      @media (max-width: 480px) { .wide, .motif { display: none; } .narrow { display: inline; } }
    </style>
  </defs>

  <rect x="1" y="1" width="1198" height="298" rx="18" fill="url(#bg)" stroke="#1e293b" stroke-width="2"/>
  <rect width="1200" height="300" rx="18" fill="url(#glow)"/>

  <!-- knowledge-graph motif -->
  <g class="motif">
    <line class="edge" x1="930" y1="150" x2="820" y2="84"/>
    <line class="edge" x1="930" y1="150" x2="1040" y2="74"/>
    <line class="edge" x1="930" y1="150" x2="1070" y2="186"/>
    <line class="edge" x1="930" y1="150" x2="850" y2="226"/>
    <line class="edge" x1="930" y1="150" x2="770" y2="162"/>
    <line class="edge" x1="1040" y1="74" x2="1128" y2="112"/>
    <line class="edge" x1="1070" y1="186" x2="1128" y2="112"/>
    <line class="edge" x1="1070" y1="186" x2="1004" y2="250"/>
    <line class="edge" x1="850" y1="226" x2="1004" y2="250"/>
    <line class="edge" x1="820" y1="84" x2="770" y2="162"/>
    <line class="edge" x1="820" y1="84" x2="912" y2="46"/>
    <line class="edge" x1="1040" y1="74" x2="912" y2="46"/>

    <circle class="node" cx="820" cy="84" r="9"/>
    <circle class="node" cx="1040" cy="74" r="11"/>
    <circle class="node" cx="1070" cy="186" r="9"/>
    <circle class="node" cx="850" cy="226" r="10"/>
    <circle class="node" cx="770" cy="162" r="7"/>
    <circle class="node" cx="1128" cy="112" r="7"/>
    <circle class="node" cx="1004" cy="250" r="7"/>
    <circle class="node" cx="912" cy="46" r="6"/>

    <circle class="hub pulse" cx="930" cy="150" r="15"/>
    <circle class="hub pulse d2" cx="1040" cy="74" r="4.5"/>
    <circle class="hub pulse d3" cx="850" cy="226" r="4"/>
    <circle class="hub pulse d2" cx="1070" cy="186" r="3.5"/>
    <circle class="hub pulse d3" cx="820" cy="84" r="3.5"/>
  </g>

  <!-- text, wide layout: shown when the banner is wider than 480px -->
  <g class="wide">
    <rect x="72" y="80" width="64" height="6" rx="3" fill="url(#accent)"/>
    <text class="t" x="72" y="160" font-size="66" font-weight="700" fill="#f8fafc" letter-spacing="-1">Ozgur Serhat Acay</text>
    <text class="t" x="72" y="214" font-size="31" font-weight="600" fill="url(#accent)">Senior MLOps &amp; ML Engineer</text>
  </g>

  <!-- text, narrow layout: larger type, shown instead at 480px and below -->
  <g class="narrow" display="none">
    <rect x="72" y="44" width="104" height="8" rx="4" fill="url(#accent)"/>
    <text class="t" x="72" y="164" font-size="104" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">Ozgur Serhat Acay</text>
    <text class="t" x="72" y="240" font-size="56" font-weight="600" fill="url(#accent)">Senior MLOps &amp; ML Engineer</text>
  </g>
</svg>
